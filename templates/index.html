
<!DOCTYPE html>
<html>
<head>
    <title>Password Security Analyzer</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">
    <h1>Password Security Analyzer</h1>
    <p>Check your password strength</p>

    <form method="POST">
        <input type="password" name="password"
               placeholder="Enter password" required>
        <button type="submit">Analyze Password</button>
    </form>

    {% if result %}
    <div class="result">
        <h2>{{ result.strength }}</h2>
        <p>Score: {{ result.score }}/5</p>

        {% for item in result.feedback %}
            <p>{{ item }}</p>
        {% endfor %}
    </div>
    {% endif %}
</div>

</body>
</html>
